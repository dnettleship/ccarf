<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-label="Model Context Protocol architecture">
<title>Model Context Protocol architecture</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
.t{font-size:22px;font-weight:700}.h{font-size:15px;font-weight:600}.s{font-size:13px}
.xs{font-size:11.5px;fill:#4b5563}.m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.b{font-weight:700}.c{text-anchor:middle}.w{fill:#fff;font-weight:700;font-size:12px}
.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.gray{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
.blue{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}.orange{fill:#fff7ed;stroke:#f97316;stroke-width:1.5}
.green{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}.red{fill:#fef2f2;stroke:#ef4444;stroke-width:1.5}
.purple{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:1.5}
.ln{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}.bi{marker-start:url(#a)}
.bus{stroke:#475569;stroke-width:1.6;fill:none}.dash{stroke-dasharray:6 4}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="590" fill="#ffffff"/>
<text x="40" y="46" class="t">Model Context Protocol (MCP) — architecture</text>
<text x="40" y="70" class="xs">One host, one MCP client per server connection. Every server can expose three primitives.</text>
<rect x="40" y="90" width="280" height="280" rx="12" class="blue"/>
<text x="60" y="116" class="h">MCP host</text>
<text x="60" y="135" class="xs">Claude Code · Claude Desktop · your app</text>
<rect x="60" y="148" width="240" height="44" rx="8" class="box"/><text x="180" y="175" class="s c">MCP client 1</text>
<rect x="60" y="220" width="240" height="44" rx="8" class="purple"/><text x="180" y="247" class="s c b">Claude (LLM)</text>
<rect x="60" y="298" width="240" height="44" rx="8" class="box"/><text x="180" y="325" class="s c">MCP client 2</text>
<path d="M180 192 V220 M180 264 V298" class="bus"/>
<path d="M302 170 H598" class="ln bi"/>
<text x="450" y="160" class="s c b">stdio</text>
<text x="450" y="188" class="xs c">JSON-RPC over stdin / stdout</text>
<path d="M302 320 H598" class="ln bi"/>
<text x="450" y="310" class="s c b">Streamable HTTP</text>
<text x="450" y="338" class="xs c">JSON-RPC over HTTP · OAuth</text>
<rect x="600" y="110" width="320" height="120" rx="12" class="box"/>
<text x="620" y="138" class="h">Local server · e.g. git, filesystem</text>
<rect x="616" y="155" width="90" height="30" rx="6" class="orange"/><text x="661" y="175" class="s c">Tools</text>
<rect x="716" y="155" width="96" height="30" rx="6" class="green"/><text x="764" y="175" class="s c">Resources</text>
<rect x="822" y="155" width="86" height="30" rx="6" class="purple"/><text x="865" y="175" class="s c">Prompts</text>
<text x="620" y="214" class="xs">Runs as a subprocess on your machine</text>
<rect x="600" y="260" width="320" height="120" rx="12" class="box"/>
<text x="620" y="288" class="h">Remote server · e.g. ticketing SaaS</text>
<rect x="616" y="305" width="90" height="30" rx="6" class="orange"/><text x="661" y="325" class="s c">Tools</text>
<rect x="716" y="305" width="96" height="30" rx="6" class="green"/><text x="764" y="325" class="s c">Resources</text>
<rect x="822" y="305" width="86" height="30" rx="6" class="purple"/><text x="865" y="325" class="s c">Prompts</text>
<text x="620" y="364" class="xs">Hosted service · authenticates with OAuth</text>
<rect x="40" y="405" width="280" height="118" rx="12" class="orange"/>
<text x="60" y="433" class="h">Tools</text>
<text x="60" y="456" class="s b">Model-controlled</text>
<text x="60" y="478" class="s">Actions Claude decides to call</text>
<text x="60" y="500" class="xs">e.g. create_ticket, run_query</text>
<rect x="340" y="405" width="280" height="118" rx="12" class="green"/>
<text x="360" y="433" class="h">Resources</text>
<text x="360" y="456" class="s b">Application-controlled</text>
<text x="360" y="478" class="s">Read-only data addressed by URI</text>
<text x="360" y="500" class="xs">e.g. file:///…, db://schema</text>
<rect x="640" y="405" width="280" height="118" rx="12" class="purple"/>
<text x="660" y="433" class="h">Prompts</text>
<text x="660" y="456" class="s b">User-controlled</text>
<text x="660" y="478" class="s">Reusable templates and workflows</text>
<text x="660" y="500" class="xs">Appear as /slash commands in Claude Code</text>
<text x="40" y="552" class="xs">Claude Code scopes: local (you, this project) · project (.mcp.json — shared, approved on first use) · user (you, all projects)</text>
<text x="40" y="572" class="xs">Security: treat tool output as untrusted (prompt injection) · least privilege · no secrets in .mcp.json — use env var expansion</text>
</svg>
