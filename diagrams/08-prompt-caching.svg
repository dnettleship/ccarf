<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Prompt caching prefix">
<title>Prompt caching prefix</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
.t{font-size:22px;font-weight:700}.h{font-size:15px;font-weight:600}.s{font-size:13px}
.xs{font-size:11.5px;fill:#4b5563}.m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.b{font-weight:700}.c{text-anchor:middle}.w{fill:#fff;font-weight:700;font-size:12px}
.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.gray{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
.blue{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}.orange{fill:#fff7ed;stroke:#f97316;stroke-width:1.5}
.green{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}.red{fill:#fef2f2;stroke:#ef4444;stroke-width:1.5}
.purple{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:1.5}
.ln{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}.bi{marker-start:url(#a)}
.bus{stroke:#475569;stroke-width:1.6;fill:none}.dash{stroke-dasharray:6 4}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="470" fill="#ffffff"/>
<text x="40" y="46" class="t">Prompt caching — the prefix must match exactly</text>
<text x="40" y="70" class="xs">Cache prefix order: tools → system → messages, up to the cache_control breakpoint.</text>
<path d="M690 102 V420" stroke="#f97316" stroke-width="2" stroke-dasharray="6 4"/>
<text x="690" y="96" class="m c" style="font-size:11.5px">cache_control: {type: "ephemeral"}</text>
<text x="40" y="120" class="s b">Request 1 — cache WRITE (costs a little more than normal input)</text>
<rect x="40" y="128" width="160" height="54" class="blue"/><text x="120" y="160" class="s c">Tools</text>
<rect x="200" y="128" width="230" height="54" class="blue"/><text x="315" y="160" class="s c">System prompt</text>
<rect x="430" y="128" width="260" height="54" class="blue"/><text x="560" y="160" class="s c">Large document</text>
<rect x="690" y="128" width="230" height="54" class="gray"/><text x="805" y="152" class="s c">User question</text><text x="805" y="170" class="xs c">not cached · changes per call</text>
<text x="40" y="234" class="s b">Request 2 within the TTL (5 min default, 1 h optional) — cache READ ≈ 10% of input price</text>
<rect x="40" y="242" width="160" height="54" class="green"/><text x="120" y="274" class="s c">Tools ✓</text>
<rect x="200" y="242" width="230" height="54" class="green"/><text x="315" y="274" class="s c">System prompt ✓</text>
<rect x="430" y="242" width="260" height="54" class="green"/><text x="560" y="274" class="s c">Large document ✓</text>
<rect x="690" y="242" width="230" height="54" class="gray"/><text x="805" y="274" class="s c">New question</text>
<text x="40" y="348" class="s b">Request 3 — timestamp added at the top of the system prompt → prefix changed → MISS</text>
<rect x="40" y="356" width="160" height="54" class="red"/><text x="120" y="388" class="s c">Tools</text>
<rect x="200" y="356" width="230" height="54" class="red"/><text x="315" y="380" class="s c">⏱ 10:42:07 +</text><text x="315" y="398" class="s c">system prompt</text>
<rect x="430" y="356" width="260" height="54" class="red"/><text x="560" y="388" class="s c">Large document ✗</text>
<rect x="690" y="356" width="230" height="54" class="gray"/><text x="805" y="388" class="s c">New question</text>
<text x="40" y="448" class="xs">Static first, dynamic last · up to 4 breakpoints · check usage.cache_creation_input_tokens and usage.cache_read_input_tokens</text>
</svg>
