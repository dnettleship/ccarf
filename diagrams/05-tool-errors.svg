<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Handling tool errors">
<title>Handling tool errors</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
.t{font-size:22px;font-weight:700}.h{font-size:15px;font-weight:600}.s{font-size:13px}
.xs{font-size:11.5px;fill:#4b5563}.m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.b{font-weight:700}.c{text-anchor:middle}.w{fill:#fff;font-weight:700;font-size:12px}
.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.gray{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
.blue{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}.orange{fill:#fff7ed;stroke:#f97316;stroke-width:1.5}
.green{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}.red{fill:#fef2f2;stroke:#ef4444;stroke-width:1.5}
.purple{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:1.5}
.ln{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}.bi{marker-start:url(#a)}
.bus{stroke:#475569;stroke-width:1.6;fill:none}.dash{stroke-dasharray:6 4}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="500" fill="#ffffff"/>
<text x="40" y="46" class="t">Handling tool errors — classify before you retry</text>
<text x="40" y="70" class="xs">Return a tool_result with is_error: true and an actionable message. Claude then decides what to do next.</text>
<rect x="370" y="90" width="220" height="50" rx="10" class="red"/>
<text x="480" y="121" class="h c">Tool call failed</text>
<path d="M480 140 V165 M140 165 H820" class="bus"/>
<path d="M140 165 V198" class="ln"/><path d="M367 165 V198" class="ln"/><path d="M593 165 V198" class="ln"/><path d="M820 165 V198" class="ln"/>
<g>
<rect x="40" y="200" width="200" height="172" rx="10" class="orange"/>
<text x="140" y="228" class="h c">Transient</text>
<text x="140" y="250" class="xs c">timeout · 429 · 503</text>
<text x="140" y="280" class="s c">Retry with backoff inside</text>
<text x="140" y="300" class="s c">the tool; if retries run out,</text>
<text x="140" y="320" class="s c">say it is temporary</text>
<rect x="55" y="336" width="170" height="24" rx="12" fill="#10b981"/><text x="140" y="353" class="w c">Retry ✓</text>
</g>
<g>
<rect x="267" y="200" width="200" height="172" rx="10" class="blue"/>
<text x="367" y="228" class="h c">Validation</text>
<text x="367" y="250" class="xs c">bad format · missing field</text>
<text x="367" y="280" class="s c">Say exactly what was wrong</text>
<text x="367" y="300" class="s c">so Claude can correct the</text>
<text x="367" y="320" class="s c">input and call again</text>
<rect x="282" y="336" width="170" height="24" rx="12" fill="#3b82f6"/><text x="367" y="353" class="w c">Claude self-corrects</text>
</g>
<g>
<rect x="493" y="200" width="200" height="172" rx="10" class="purple"/>
<text x="593" y="228" class="h c">Business rule</text>
<text x="593" y="250" class="xs c">refund over limit · order too old</text>
<text x="593" y="280" class="s c">Explain the policy; Claude</text>
<text x="593" y="300" class="s c">informs the user or</text>
<text x="593" y="320" class="s c">escalates to a human</text>
<rect x="508" y="336" width="170" height="24" rx="12" fill="#ef4444"/><text x="593" y="353" class="w c">Do NOT retry</text>
</g>
<g>
<rect x="720" y="200" width="200" height="172" rx="10" class="red"/>
<text x="820" y="228" class="h c">Permission</text>
<text x="820" y="250" class="xs c">403 · needs approval</text>
<text x="820" y="280" class="s c">Route to an approval flow</text>
<text x="820" y="300" class="s c">or a human — never loop</text>
<text x="820" y="320" class="s c">on the same call</text>
<rect x="735" y="336" width="170" height="24" rx="12" fill="#ef4444"/><text x="820" y="353" class="w c">Do NOT retry</text>
</g>
<rect x="40" y="395" width="880" height="85" rx="10" class="gray"/>
<text x="60" y="422" class="h">Anti-patterns</text>
<text x="60" y="446" class="s">✗ Returning an empty success — Claude can't tell “no results” from “the call broke”</text>
<text x="60" y="468" class="s">✗ Throwing an exception that kills the agent loop</text>
<text x="440" y="468" class="s">✗ Retrying business-rule or permission failures</text>
</svg>
